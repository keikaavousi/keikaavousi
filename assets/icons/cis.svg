<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="12" fill="#f4efe6"/>

  <!-- document / clinical note -->
  <rect x="18" y="14" width="28" height="36" rx="4"
        fill="none" stroke="#2f2a24" stroke-width="2"/>

  <!-- messy text lines -->
  <line x1="22" y1="22" x2="42" y2="22" stroke="#2f2a24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="28" x2="38" y2="28" stroke="#2f2a24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="34" x2="44" y2="34" stroke="#2f2a24" stroke-width="1.5" stroke-linecap="round"/>

  <!-- structured nodes breaking out of form -->
  <circle cx="18" cy="42" r="3" fill="none" stroke="#2f2a24" stroke-width="2"/>
  <circle cx="32" cy="48" r="3" fill="none" stroke="#2f2a24" stroke-width="2"/>
  <circle cx="46" cy="42" r="3" fill="none" stroke="#2f2a24" stroke-width="2"/>

  <!-- chaos / linkage -->
  <line x1="18" y1="42" x2="32" y2="48" stroke="#2f2a24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="48" x2="46" y2="42" stroke="#2f2a24" stroke-width="1.5" stroke-linecap="round"/>
</svg>